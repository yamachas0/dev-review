<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<title>ハリノアナ — 針の穴を通すパス</title>
<style>
  html,body{margin:0;padding:0;background:#f3efe6;height:100%;overflow:hidden;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #c{display:block;touch-action:none;width:100vw;height:100vh;height:100dvh}
  #hud{position:fixed;left:0;right:0;top:0;padding:10px 14px;pointer-events:none;color:#222;z-index:3}
  #hud .row{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:18px}
  #hud .sub{font-size:13px;margin-top:2px;color:#555}
  #tbar{margin-top:6px;height:3px;background:rgba(0,0,0,.12);border-radius:2px;overflow:hidden}
  #tbarFill{height:100%;width:100%;background:#2b6cb0;transition:background .2s}
  #tbarFill.warn{background:#e0552b}
  #judges{font-size:11px;color:#777;margin-top:6px;line-height:1.3;text-align:right}
  #lead{position:fixed;left:0;right:0;top:14%;text-align:center;pointer-events:none;z-index:3;padding:0 18px}
  #lead .big{font-size:23px;font-weight:900;color:#222;letter-spacing:.02em;text-shadow:0 2px 0 #fff,0 0 14px #fff}
  #lead .sm{margin-top:5px;font-size:13px;font-weight:700;color:#2b6cb0;text-shadow:0 0 8px #fff;min-height:16px}
  #msg{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3}
  #msg .t{font-size:34px;font-weight:900;color:#222;letter-spacing:.05em}
  #msg .s{font-size:18px;font-weight:700;color:#2b6cb0;margin-top:6px}
  #msg.ng .t{color:#d33}
  #msg.slow .t{font-size:54px;color:#e0552b;text-shadow:0 0 18px rgba(224,85,43,.5)}
  #pg{position:fixed;left:0;top:0;width:132px;height:132px;margin:-66px 0 0 -66px;pointer-events:none;z-index:3;display:none}
  #pg .trk{fill:none;stroke:rgba(34,34,34,.16);stroke-width:7}
  #pg .band{fill:none;stroke:rgba(43,108,176,.28);stroke-width:11}
  #pg .fg{fill:none;stroke:#e0552b;stroke-width:7;stroke-linecap:round;transition:stroke .12s}
  #pg.good .fg{stroke:#2b6cb0}
  #pg .lbl{font:800 15px "Hiragino Sans",sans-serif;fill:#222;text-anchor:middle}
  #pg.good .lbl{fill:#2b6cb0}
  #flash{position:fixed;inset:0;background:#d33;opacity:0;pointer-events:none;z-index:2;transition:opacity .08s}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,.55) 100%);transition:opacity .3s}
  #mute{position:fixed;left:14px;bottom:max(20px, env(safe-area-inset-bottom));z-index:4;pointer-events:auto;width:34px;height:34px;border-radius:50%;border:2px solid #222;background:#fff;font-size:16px;line-height:30px;text-align:center}
  .btn{pointer-events:auto;position:fixed;left:50%;transform:translateX(-50%);padding:14px 22px;border-radius:14px;border:2px solid #222;background:#fff;color:#222;font-size:18px;font-weight:700;box-shadow:3px 3px 0 #222;cursor:pointer;z-index:5}
  .btn:active{transform:translateX(-50%) translate(2px,2px);box-shadow:1px 1px 0 #222}
  .hidden{display:none!important}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#222;text-align:center;padding:0 24px;z-index:3}
  #title h1{font-size:46px;margin:0 0 6px}
  #title p{margin:4px 0;font-size:14px;color:#555;line-height:1.7}
  #result{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;pointer-events:none;z-index:3}
  #result img{max-width:calc(100vw - 32px);max-height:66vh;border-radius:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div><div id="vig"></div>
<div id="hud" class="hidden">
  <div class="row"><span id="lv">Lv 1</span><span id="sc">0 点</span></div>
  <div class="sub" id="to">ターンオーバー ○○○</div>
  <div id="tbar"><div id="tbarFill"></div></div>
  <div id="judges"></div>
</div>
<svg id="pg" viewBox="0 0 100 100">
  <circle class="trk" cx="50" cy="50" r="42"></circle>
  <circle class="band" id="pgBand" cx="50" cy="50" r="42" transform="rotate(-90 50 50)"></circle>
  <circle class="fg" id="pgFg" cx="50" cy="50" r="42" transform="rotate(-90 50 50)"></circle>
  <text class="lbl" id="pgLbl" x="50" y="55">強</text>
</svg>
<button id="mute" class="hidden">🔊</button>
<div id="msg"><div class="t"></div><div class="s"></div></div>
<div id="lead" class="hidden"><div class="big" id="leadBig"></div><div class="sm" id="leadSm"></div></div>
<div id="title">
  <h1>ハリノアナ</h1>
  <p>針の穴を通すパスのゲーム</p>
  <p>味方（赤）は1人。黒ユニの守備が両手を広げて立ち塞がる。<br><b>ボールを掴んで、味方へ弾く。</b>指を離した瞬間に飛ぶ。<br>引いた深さ＝山なり＋沈む回転／ぐるぐる回す＝カーブ／弾く速さ＝強さ。<br>守備の指先をかすめるほど点が高い。審査員はバグっている。ターンオーバー3回で終了。</p>
</div>
<div id="result" class="hidden"><img id="card" alt="result"></div>
<button id="bStart" class="btn" style="top:74%">はじめる</button>
<button id="bShare" class="btn hidden" style="top:78%">スコアをシェア</button>
<button id="bRetry" class="btn hidden" style="top:88%">もう一回</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h;}
function segDist(p,a,b){const ab=b.clone().sub(a);const t=clamp(p.clone().sub(a).dot(ab)/Math.max(1e-6,ab.lengthSq()),0,1);return p.distanceTo(a.clone().add(ab.multiplyScalar(t)));}
const $=id=>document.getElementById(id);

// ---------------- audio ----------------
let AC=null, muted=false; try{ muted=localStorage.getItem('harinoana_mute')==='1'; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(freq,dur,type='sine',gain=0.15,slide=0){ const a=ac(); if(!a||muted) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(freq,a.currentTime); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),a.currentTime+dur); g.gain.setValueAtTime(gain,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur); o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.02); }
function noise(dur,gain=0.12,hp=800){ const a=ac(); if(!a||muted) return; const n=a.sampleRate*dur, b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const s=a.createBufferSource(); s.buffer=b; const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=a.createGain(); g.gain.value=gain; s.connect(f).connect(g).connect(a.destination); s.start(); }
const SFX={ tap:()=>tone(900,0.04,'square',0.05), grab:()=>tone(520,0.05,'sine',0.07), lock:()=>tone(1200,0.06,'sine',0.06), spin:()=>tone(1500,0.03,'square',0.03), throw:()=>{noise(0.25,0.1,600); tone(220,0.18,'triangle',0.08,120);}, catch:()=>{tone(660,0.08,'square',0.12); tone(990,0.14,'sine',0.12);}, cut:()=>{tone(110,0.25,'sawtooth',0.15,-60); noise(0.15,0.08,300);}, miss:()=>tone(160,0.3,'triangle',0.1,-80), bounce:()=>tone(90,0.1,'sine',0.2), slow:()=>tone(60,0.6,'sine',0.12,-20), level:()=>{tone(523,0.12,'sine',0.12); setTimeout(()=>tone(784,0.18,'sine',0.12),110);}, over:()=>{tone(392,0.2,'triangle',0.12); setTimeout(()=>tone(262,0.4,'triangle',0.12),200);} };
const muteBtn=$('mute'); function renderMute(){ muteBtn.textContent = muted?'🔇':'🔊'; } renderMute();
muteBtn.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); muted=!muted; try{localStorage.setItem('harinoana_mute',muted?'1':'0');}catch(e){} renderMute(); });

// ---------------- scene ----------------
const cv=$('c'); const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true}); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xf3efe6); scene.fog=new THREE.Fog(0xf3efe6, 22, 48);
const camera=new THREE.PerspectiveCamera(66,1,0.05,120);
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize); resize();
scene.add(new THREE.HemisphereLight(0xffffff,0xcfc6b2,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.9); sun.position.set(4,9,5); scene.add(sun);
function courtTex(){ const c=document.createElement('canvas'); c.width=1024; c.height=1024; const g=c.getContext('2d'); g.fillStyle='#e9d9b8'; g.fillRect(0,0,1024,1024);
  for(let i=0;i<1024;i+=14){ g.fillStyle= (i/14)%2? 'rgba(120,80,30,0.06)':'rgba(255,255,255,0.05)'; g.fillRect(0,i,1024,14); }
  g.strokeStyle='#b98a3a'; g.lineWidth=6; const s=1024/30, X=x=>512+x*s, Z=z=>512+z*s;
  g.strokeRect(X(-7.5),Z(-14),15*s,28*s); g.beginPath(); g.moveTo(X(-7.5),Z(0)); g.lineTo(X(7.5),Z(0)); g.stroke(); g.beginPath(); g.arc(X(0),Z(0),1.8*s,0,Math.PI*2); g.stroke();
  g.strokeRect(X(-2.45),Z(-14),4.9*s,5.8*s); g.beginPath(); g.arc(X(0),Z(-8.2),1.8*s,0,Math.PI); g.stroke(); g.beginPath(); g.arc(X(0),Z(-12.4),6.75*s,0.25,Math.PI-0.25); g.stroke();
  g.strokeRect(X(-2.45),Z(8.2),4.9*s,5.8*s); g.beginPath(); g.arc(X(0),Z(12.4),6.75*s,Math.PI+0.25,2*Math.PI-0.25); g.stroke();
  const t=new THREE.CanvasTexture(c); t.anisotropy=8; return t; }
const court=new THREE.Mesh(new THREE.PlaneGeometry(30,30), new THREE.MeshLambertMaterial({map:courtTex()})); court.rotation.x=-Math.PI/2; scene.add(court);
{ const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,3.2,10), new THREE.MeshLambertMaterial({color:0x555555})); pole.position.set(0,1.6,-13.6); scene.add(pole);
  const board=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.05,0.05), new THREE.MeshLambertMaterial({color:0xffffff})); board.position.set(0,3.4,-13.0); scene.add(board); board.add(new THREE.LineSegments(new THREE.EdgesGeometry(board.geometry), new THREE.LineBasicMaterial({color:0x222222})));
  const hoop=new THREE.Mesh(new THREE.TorusGeometry(0.23,0.02,8,24), new THREE.MeshLambertMaterial({color:0xe0552b})); hoop.rotation.x=Math.PI/2; hoop.position.set(0,3.05,-12.7); scene.add(hoop); }

// ---------------- figures ----------------
const OUT=new THREE.MeshBasicMaterial({color:0x111111, side:THREE.BackSide});
const SKIN=new THREE.MeshLambertMaterial({color:0xe6b48f});
const SHADOW_GEO=new THREE.CircleGeometry(0.4,20), SHADOW_MAT=new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:0.16});
function box(w,h,d,mat){ const g=new THREE.Group(); const geo=new THREE.BoxGeometry(w,h,d); const m=new THREE.Mesh(geo,mat); g.add(m); const o=new THREE.Mesh(geo,OUT); o.scale.setScalar(1.06); g.add(o); return g; }
function makePlayer(jersey, shorts, shoes){
  const jm=new THREE.MeshLambertMaterial({color:jersey}), sm=new THREE.MeshLambertMaterial({color:shorts}), shm=new THREE.MeshLambertMaterial({color:shoes});
  const root=new THREE.Group(); const segs=[];
  const pelvis=new THREE.Group(); pelvis.position.y=0.98; root.add(pelvis);
  const torso=new THREE.Group(); torso.position.y=0.5; pelvis.add(torso);
  const tb=box(0.46,0.5,0.26,jm); tb.position.y=-0.25; torso.add(tb); const tEnd=new THREE.Object3D(); tEnd.position.y=-0.5; torso.add(tEnd); segs.push({a:torso,b:tEnd,r:0.2});
  const shortsG=box(0.44,0.26,0.28,sm); shortsG.position.y=-0.08; pelvis.add(shortsG); segs.push({a:pelvis,b:pelvis,r:0.2});
  const neck=new THREE.Group(); neck.position.y=0.02; torso.add(neck);
  const head=new THREE.Group(); head.position.y=0.17; neck.add(head); const hb=box(0.26,0.26,0.26,SKIN); head.add(hb);
  for(const sx of [-1,1]){ const eye=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.02), new THREE.MeshBasicMaterial({color:0x222222})); eye.position.set(sx*0.06,0.02,0.135); head.add(eye); }
  segs.push({a:head,b:head,r:0.16});
  const arms={}, legs={};
  for(const side of ['L','R']){ const sgn= side==='L'?-1:1;
    const sh=new THREE.Group(); sh.position.set(sgn*0.3,-0.03,0); torso.add(sh);
    const ua=box(0.13,0.3,0.13,jm); ua.position.y=-0.15; sh.add(ua); const uaEnd=new THREE.Object3D(); uaEnd.position.y=-0.3; sh.add(uaEnd); segs.push({a:sh,b:uaEnd,r:0.08});
    const el=new THREE.Group(); el.position.y=-0.3; sh.add(el);
    const fa=box(0.12,0.28,0.12,SKIN); fa.position.y=-0.14; el.add(fa); const faEnd=new THREE.Object3D(); faEnd.position.y=-0.28; el.add(faEnd); segs.push({a:el,b:faEnd,r:0.075});
    const hand=box(0.13,0.15,0.06,SKIN); hand.position.y=-0.35; el.add(hand); const hEnd=new THREE.Object3D(); hEnd.position.y=-0.42; el.add(hEnd); segs.push({a:faEnd,b:hEnd,r:0.08});
    arms[side]={sh,el,sgn,hand:hEnd};
    const hip=new THREE.Group(); hip.position.set(sgn*0.13,-0.1,0); pelvis.add(hip);
    const th=box(0.17,0.42,0.17,SKIN); th.position.y=-0.21; hip.add(th); const thEnd=new THREE.Object3D(); thEnd.position.y=-0.42; hip.add(thEnd); segs.push({a:hip,b:thEnd,r:0.1});
    const kn=new THREE.Group(); kn.position.y=-0.42; hip.add(kn);
    const sn=box(0.15,0.42,0.15,SKIN); sn.position.y=-0.21; kn.add(sn); const snEnd=new THREE.Object3D(); snEnd.position.y=-0.42; kn.add(snEnd); segs.push({a:kn,b:snEnd,r:0.09});
    const shoe=box(0.16,0.1,0.3,shm); shoe.position.set(0,-0.46,0.05); kn.add(shoe);
    legs[side]={hip,kn,sgn};
  }
  const shadow=new THREE.Mesh(SHADOW_GEO,SHADOW_MAT); shadow.rotation.x=-Math.PI/2; shadow.position.y=0.006; scene.add(shadow);
  scene.add(root);
  return {root,pelvis,torso,head,arms,legs,segs,shadow,
    chest:()=>{const p=new THREE.Vector3(); torso.getWorldPosition(p); p.y-=0.2; return p;},
    handsUp:()=>{const p=new THREE.Vector3(); head.getWorldPosition(p); p.y+=0.4; return p;}};
}
function placeShadow(f){ f.shadow.position.x=f.root.position.x; f.shadow.position.z=f.root.position.z; }
// 守備：膝を曲げ前傾・両腕を肩から横に広げ・サイドステップ。ボールが来たら近い側の腕で反応（反応の速さ d.rt 秒）
function poseDefender(f,t,d,dt,ballInfo){
  const tx=d.baseX + d.amp*Math.sin(d.w*t+d.ph); d.x += clamp(tx-d.x,-d.vmax*dt,d.vmax*dt);
  f.root.position.set(d.x, 0.02*Math.abs(Math.sin(d.w*2*t+d.ph)), d.z);
  f.root.rotation.y = Math.PI + clamp((P.x - d.x)*0.12,-0.35,0.35);
  f.pelvis.position.y = 0.86; f.pelvis.rotation.x = -0.32;
  f.torso.rotation.x = 0.1;
  f.head.rotation.x = 0.35;
  for(const side of ['L','R']){ const a=f.arms[side]; const sway=0.12*Math.sin(d.wa*t + (side==='L'?0:1.3) + d.ph);
    let spread=1.42+sway, fwd=-0.35, elb=-0.35;
    if(ballInfo && ballInfo.near===d && ((side==='R')===(ballInfo.pos.x>=d.x))){
      const targetRaise = clamp(0.5 + (ballInfo.pos.y-0.9)*1.15, 0.35, 2.5);
      d.react = d.react===undefined? spread : d.react; d.react = lerp(d.react, targetRaise, Math.min(1, dt/(d.rt||0.22))); spread=d.react; fwd=-0.6; elb=-0.2;
    } else if(d.react!==undefined && ballInfo===null){ d.react=undefined; }
    a.sh.rotation.z = -a.sgn*spread; a.sh.rotation.x = fwd; a.el.rotation.x = elb;
    const l=f.legs[side]; const lp=d.w*1.3*t + (side==='L'?0:Math.PI);
    l.hip.rotation.x = -0.55 + 0.12*Math.sin(lp); l.hip.rotation.z = a.sgn*0.22; l.kn.rotation.x = 0.95 + 0.1*Math.max(0,Math.sin(lp+0.5));
  }
  placeShadow(f);
}
function poseMate(f,t,m){
  f.root.position.set(m.x + 0.05*Math.sin(t*1.3), 0, m.z); f.root.rotation.y=Math.PI;
  f.pelvis.position.y=0.98; f.pelvis.rotation.x=0; f.torso.rotation.x=0; f.head.rotation.x=0;
  for(const side of ['L','R']){ const a=f.arms[side]; a.sh.rotation.z=-a.sgn*(2.7+0.06*Math.sin(3*t+(side==='L'?0:1))); a.sh.rotation.x=-0.15; a.el.rotation.x=-0.25;
    const l=f.legs[side]; l.hip.rotation.x=-0.05; l.hip.rotation.z=a.sgn*0.1; l.kn.rotation.x=0.12; }
  placeShadow(f);
}

// ---------------- ball / gesture visuals ----------------
const BALL_R=0.12;
const ball=new THREE.Mesh(new THREE.SphereGeometry(BALL_R,18,14), new THREE.MeshLambertMaterial({color:0xe8842b})); const ballO=new THREE.Mesh(ball.geometry,OUT); ballO.scale.setScalar(1.08); ball.add(ballO);
ball.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.SphereGeometry(BALL_R*1.01,8,4)), new THREE.LineBasicMaterial({color:0x7a3e0c}))); scene.add(ball);
const trailN=48; const trailGeo=new THREE.BufferGeometry(); trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(trailN*3),3));
const trail=new THREE.Line(trailGeo, new THREE.LineBasicMaterial({color:0xe0552b,transparent:true,opacity:0.7})); trail.visible=false; scene.add(trail);
const trailPts=[];
// 到達板（どこから投げるか＝指を置く場所）
const reach=new THREE.Mesh(new THREE.PlaneGeometry(1.0,1.1), new THREE.MeshBasicMaterial({color:0x2b6cb0,transparent:true,opacity:0.14,side:THREE.DoubleSide})); reach.visible=false; scene.add(reach);
const reachEdge=new THREE.LineSegments(new THREE.EdgesGeometry(reach.geometry), new THREE.LineDashedMaterial({color:0x2b6cb0,dashSize:0.08,gapSize:0.05,transparent:true,opacity:0.7})); reachEdge.computeLineDistances(); reach.add(reachEdge);
const tapRing=new THREE.Mesh(new THREE.RingGeometry(0.1,0.14,32), new THREE.MeshBasicMaterial({color:0x2b6cb0,side:THREE.DoubleSide,transparent:true,opacity:0.9})); tapRing.visible=false; scene.add(tapRing);
const grabRing=new THREE.Mesh(new THREE.RingGeometry(0.17,0.21,28), new THREE.MeshBasicMaterial({color:0x222222,side:THREE.DoubleSide,transparent:true,opacity:0.85})); grabRing.visible=false; scene.add(grabRing);
// ゴム紐（掴んだ点 → 指の位置）
const bandGeo=new THREE.BufferGeometry(); bandGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(2*3),3));
const band=new THREE.Line(bandGeo, new THREE.LineBasicMaterial({color:0x222222,transparent:true,opacity:0.55})); band.visible=false; scene.add(band);
// 予定軌道（点線・回転込み）
const PRE_N=40;
const arrowGeo=new THREE.BufferGeometry(); arrowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PRE_N*3),3));
const arrow=new THREE.Points(arrowGeo, new THREE.PointsMaterial({color:0x222222,size:0.098,sizeAttenuation:true,transparent:true,opacity:0.9})); arrow.visible=false; scene.add(arrow);
const arrowLine=new THREE.Line(arrowGeo, new THREE.LineBasicMaterial({color:0x222222,transparent:true,opacity:0.35})); arrowLine.visible=false; scene.add(arrowLine);

// 押す＝掴む / 引く・払う＝角度と強さ / ぐるぐる＝回転 / 離す＝投げる / トン＝フェイク
const TAP_MS=200, TAP_PX=14, FLICK_MS=140, STALE_MS=150, MIN_DIR_PX=18, SPIN_MIN_R=26, SPIN_KEEP_R=20, BELOW_BAND=8, DOWN_UY=-0.5;
let pid=null;
const ray=new THREE.Raycaster();
function screenToPlane(px,py,clampIt){
  const nd=new THREE.Vector2((px/window.innerWidth)*2-1, -(py/window.innerHeight)*2+1); ray.setFromCamera(nd,camera);
  const plane=new THREE.Plane(V(0,0,1), -REACH_Z()); const hit=new THREE.Vector3(); if(!ray.ray.intersectPlane(plane,hit)) return null;
  if(clampIt){ hit.x=clamp(hit.x,P.x-0.4,P.x+0.6); hit.y=clamp(hit.y,0.75,1.85); }
  return hit;
}
function newStroke(x,y,t){ return {ax:x, ay:y, x, y, t0:t, t, hist:[{x,y,t}], maxPull:0, dip:0, spinAcc:0, lastAng:null, deep:{x,y}, moved:0}; }
function feedStroke(st,x,y,t){
  st.x=x; st.y=y; st.t=t;
  const lastH=st.hist[st.hist.length-1];
  // 同じ座標は積まない（離す瞬間の重複で直近ベクトルが0になるのを防ぐ）
  if(!lastH || lastH.x!==x || lastH.y!==y){ st.hist.push({x,y,t}); if(st.hist.length>40) st.hist.shift(); }
  const dx=x-st.ax, dy=y-st.ay, r=Math.hypot(dx,dy);
  st.moved=Math.max(st.moved, r);
  if(r>st.maxPull){ st.maxPull=r; st.deep={x,y}; }
  if(dy>st.dip) st.dip=dy;                       // 画面下方向＝沈めた深さ
  // 回転の積算：入りは26px・抜けは20px（境界での震えで角度系列が切れないように）
  if(r>SPIN_MIN_R || (st.lastAng!==null && r>SPIN_KEEP_R)){ const a=Math.atan2(dy,dx);   // 画面時計回り＝正＝右カーブ
    if(st.lastAng!==null){ let d=a-st.lastAng; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; if(Math.abs(d)<1.6) st.spinAcc+=d; }
    st.lastAng=a; } else st.lastAng=null;
}
function flickVec(st,now){ // 直近 FLICK_MS の変位（＝向き）と速度（＝強さ）
  const h=st.hist; let i=h.length-1; const tEnd=h[i]; while(i>0 && tEnd.t-h[i-1].t < FLICK_MS) i--;
  if(i===h.length-1) i=Math.max(0,h.length-2);   // 低FPS端末でも最低2点は使う
  const a=h[i], dx=tEnd.x-a.x, dy=tEnd.y-a.y, dt=Math.max(1,tEnd.t-a.t);
  const stale=Math.max(0, now-tEnd.t);           // 指が止まっている時間
  const live = stale<STALE_MS;                   // 止まったら「払っていない」＝パチンコ扱いへ落とす
  const decay = clamp(1-stale/STALE_MS,0,1);
  return {dx: live?dx:0, dy: live?dy:0, sp:(Math.hypot(dx,dy)/dt)*1000*decay};
}
// ストローク状態 → 発射パラメータ（プレビューと実射で同じ関数を使う）
function computeShot(st,now){
  const f=flickVec(st,now), fl=Math.hypot(f.dx,f.dy);
  const px=st.x-st.ax, py=st.y-st.ay, pl=Math.hypot(px,py);   // 指を置いた点からの変位（引き）
  let dx,dy,src;
  // 味方は常に画面の上側にいる＝「上へ払う」が前、「下へ引く」が引き。この非対称で向きを一意に決める
  const below = py>BELOW_BAND;                                   // 指がアンカーより下＝引いている状態
  const uyOf=(x,y)=>{ const L=Math.hypot(x,y)||1; return -y/L; }; // 画面上向きが+1
  const downish = fl>=MIN_DIR_PX && uyOf(f.dx,f.dy) < DOWN_UY;   // 水平より30度以上下を向いた払い＝「まだ引いている」
  if(fl>=MIN_DIR_PX && !(below&&downish)){ dx=f.dx; dy=f.dy; src='flick'; }  // ①払っている＝払った向きへ飛ぶ（横でも上でも）
  else if(below && pl>=MIN_DIR_PX){ dx=-px; dy=-py; src='sling'; }           // ②引いたまま止めた/引き続けた＝パチンコ（引いた逆へ）
  else if(fl>=MIN_DIR_PX){ dx=f.dx; dy=f.dy; src='flick'; }                  // ③それ以外の払い
  else { dx=0; dy=-1; src='none'; }                                          // ④無操作＝味方の胸へ
  const L=Math.max(1e-6,Math.hypot(dx,dy)); const ux=dx/L, uy=-dy/L;   // ux:右が+ / uy:上が+
  const dipN=clamp((st.dip-40)/180,0,1);
  const yaw = clamp(-ux*0.70, -0.70, 0.70);
  const pitch = clamp(0.12 + dipN*0.45 + (uy-0.9)*0.35, -0.30, 0.60);
  const pv=clamp(f.sp/2600,0,1), dl=clamp(st.maxPull/240,0,1);
  const power = clamp(0.60*pv + 0.40*dl, 0.05, 1);
  const spin = { side: clamp(st.spinAcc/5.5,-1,1), top: (uy>0.15? dipN : 0) };
  return {yaw,pitch,power,spin,src,dipN,pv,dl};
}
function applyShot(s){ S.yaw=s.yaw; S.pitch=s.pitch; S.power=s.power; S.spin={side:s.spin.side, top:s.spin.top}; S.shot=s; }
cv.addEventListener('pointerdown',ev=>{
  ac(); if(S.mode!=='play'||S.flight||pid!==null) return;
  pid=ev.pointerId; try{ cv.setPointerCapture(pid); }catch(e){}
  const g=screenToPlane(ev.clientX,ev.clientY,true); if(!g){ pid=null; return; }
  S.rel=g; grabRing.position.copy(g); grabRing.visible=true;
  S.stroke=newStroke(ev.clientX,ev.clientY,performance.now());
  applyShot(computeShot(S.stroke,performance.now()));
  SFX.grab(); setPhase('drag');
});
function onMove(ev){ if(ev.pointerId!==pid||!S.stroke) return; const t=performance.now();
  const prevTurns=Math.floor(Math.abs(S.stroke.spinAcc)/(Math.PI/2));
  // 間引かれた中間点も拾う（低FPS端末でフリック方向と回転を取りこぼさない）
  let co=null; try{ co=ev.getCoalescedEvents? ev.getCoalescedEvents() : null; }catch(e){}
  if(co && co.length>1){ const n=co.length; co.forEach((c,i)=>feedStroke(S.stroke,c.clientX,c.clientY, t-(n-1-i)*(1000/120))); }
  feedStroke(S.stroke,ev.clientX,ev.clientY,t);
  if(Math.floor(Math.abs(S.stroke.spinAcc)/(Math.PI/2))>prevTurns) SFX.spin();
  applyShot(computeShot(S.stroke,t));
}
function onUp(ev){
  if(ev.pointerId!==pid||!S.stroke) return; const st=S.stroke; const now=performance.now(); pid=null;
  try{ cv.releasePointerCapture(ev.pointerId); }catch(e){}
  feedStroke(st,ev.clientX,ev.clientY,now);
  if(now-st.t0 < TAP_MS && st.moved < TAP_PX){   // トン＝フェイク（投げない）
    S.fakes++; S.stroke=null; S.rel=null; SFX.tap(); showMsg('フェイク','審査員Cが見ている',true,800); setPhase('ready'); return;
  }
  applyShot(computeShot(st,now)); S.stroke=null; throwBall(st);
}
function abortStroke(ev){ if(ev && ev.pointerId!==undefined && ev.pointerId!==pid) return; // 2本目の指のcancelで有効なストロークを消さない
  if(pid===null && !S.stroke) return; pid=null; S.stroke=null; S.rel=null; if(S.mode==='play'&&!S.flight) setPhase('ready'); }
window.addEventListener('pointermove',onMove,{passive:true});
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',abortStroke);
window.addEventListener('blur',()=>abortStroke(null));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) abortStroke(null); });

// ---------------- throw / physics ----------------
function integrate(pos,vel,spin,steps,h,out){
  const p=pos.clone(), v=vel.clone(); const up=V(0,1,0);
  for(let i=0;i<steps;i++){
    const sp=v.length(); const acc=V(0,-9.81,0);
    acc.addScaledVector(v,-0.06*sp);
    const side=new THREE.Vector3().crossVectors(v,up).normalize();
    acc.addScaledVector(side, spin.side*4.2*Math.min(1,sp/8));
    acc.addScaledVector(up, -spin.top*3.0*Math.min(1,sp/8));
    v.addScaledVector(acc,h); p.addScaledVector(v,h);
    if(p.y<BALL_R){ p.y=BALL_R; if(v.y<0){ v.y=-v.y*0.62; v.x*=0.85; v.z*=0.85; } }
    if(out) out.push(p.clone());
  }
}
function shotVelocity(R,yaw,pitch,power){
  const target=figs.mate.chest(); const dir=target.clone().sub(R).normalize();
  const y2=Math.atan2(dir.x,dir.z)+yaw, p2=Math.asin(dir.y)+pitch;
  const speed=5.5+power*12.5;
  return V(Math.sin(y2)*Math.cos(p2), Math.sin(p2), Math.cos(y2)*Math.cos(p2)).multiplyScalar(speed);
}
function throwBall(st){
  const R=releasePoint(); const v=shotVelocity(R,S.yaw,S.pitch,S.power);
  const hold=(st? (st.t-st.t0):0)/1000, turns=st? Math.abs(st.spinAcc)/(2*Math.PI):0, pullN=st? clamp(st.maxPull/230,0,1.6):0;
  S.flight={pos:R.clone(), vel:v, t:0, minD:Infinity, holes:0, closeStreak:false, done:false, bounces:0, spin:{...S.spin},
    meta:{hesitation:(performance.now()-S.levelStart)/1000, power:S.power, off:Math.hypot(S.yaw,S.pitch), relOff:Math.hypot(R.x-(P.x+0.25), R.y-1.3),
          turns, pullN, hold, fakes:S.fakes}, trail:[]};
  trailPts.length=0; trail.visible=true; S.cam='ball'; S.slowShown=false; S.timeScale=1; setPhase('flight'); SFX.throw();
  S.camPos.copy(camera.position); S.camLook.copy(figs.mate.chest());
}
function stepPhysics(dt){
  const f=S.flight; const sub=8; const h=dt/sub;
  for(let k=0;k<sub;k++){
    const v=f.vel, p=f.pos; const sp=v.length();
    const g=V(0,-9.81,0);
    const drag=v.clone().multiplyScalar(-0.06*sp);
    const up=V(0,1,0); const side=new THREE.Vector3().crossVectors(v,up).normalize();
    const magnus=side.multiplyScalar(f.spin.side*4.2*Math.min(1,sp/8)).add(up.clone().multiplyScalar(-f.spin.top*3.0*Math.min(1,sp/8)));
    v.addScaledVector(g.add(drag).add(magnus), h); p.addScaledVector(v,h);
    if(p.y<BALL_R){ p.y=BALL_R; if(v.y<0){ v.y=-v.y*0.62; v.x*=0.85; v.z*=0.85; f.bounces++; if(f.spin.top>0.3){ v.z*=1.15; } SFX.bounce(); } }
    f.t+=h;
    let stepMin=Infinity, near=null;
    for(const d of figs.defs){ for(const s of d.segs){ const a=new THREE.Vector3(), b=new THREE.Vector3(); s.a.getWorldPosition(a); s.b.getWorldPosition(b); const dd=segDist(p,a,b)-s.r-BALL_R; if(dd<stepMin){stepMin=dd; near=d;} if(dd<0) return endFlight(false,'カットされた'); } }
    f.minD=Math.min(f.minD,stepMin); f.nearDef=near;
    if(stepMin<0.12){ if(!f.closeStreak){f.holes++; f.closeStreak=true;} } else f.closeStreak=false;
    const mc=figs.mate.chest(); if(p.distanceTo(mc)<0.55 || p.distanceTo(figs.mate.handsUp())<0.45) return endFlight(true,'ナイスパス');
    if(f.t>4.5 || Math.abs(p.x)>15 || p.z<-16 || p.z>P.z+2) return endFlight(false, f.bounces>2? '転がって終わった' : '誰もいない所へ');
    if(f.bounces>=3 && sp<1.5) return endFlight(false,'転がって終わった');
  }
  ball.position.copy(f.pos); trailPts.push(f.pos.clone()); if(trailPts.length>trailN) trailPts.shift();
  const arr=trailGeo.attributes.position.array; for(let i=0;i<trailN;i++){ const q=trailPts[Math.min(i,trailPts.length-1)]||f.pos; arr[i*3]=q.x; arr[i*3+1]=q.y; arr[i*3+2]=q.z; } trailGeo.attributes.position.needsUpdate=true; trailGeo.setDrawRange(0,Math.max(2,trailPts.length));
}

// ---------------- scoring ----------------
const ADJ=['逆ギレ','ノールック','湿度高めの','なぜか','月面','裏口からの','無音の','二度見','時空を超えた','誰も頼んでない','税込','半信半疑の','伝説の（自称）','とりあえずの','逆走','深夜テンションの','見えてた風の','背面（だと思う）','指先の','息を止めた'];
const SUF=['','','・改','・弐','（公式非認可）','（未遂）','・完全版','（審査員Bが命名）','（本人談）','（味方も驚く）'];
function passName(f,ok){ let noun;
  const sp=Math.abs(f.spin.side), tp=f.spin.top, m=f.meta;
  if(sp>0.5 && ok && f.minD<0.1) noun='バナナ針通し'; else if(sp>0.5) noun='バナナカーブ';
  else if(tp>0.4 && f.bounces>=1) noun='沈むバウンズ'; else if(f.bounces>=2) noun='二段バウンズ';
  else if(m.power>0.85) noun='剛速球チェスト'; else if(ok && f.minD<0.04) noun='針の穴'; else if(f.holes>=2) noun='二重穴通し';
  else if(m.relOff>0.6) noun='変な所から出したパス'; else if(f.minD>0.6) noun='安全運転チェスト'; else noun='チェストパス';
  if(m.turns>=1.5) noun='こねくり回した'+noun;
  else if(m.fakes>=2) noun='フェイク2回入れた'+noun;
  else if(m.hesitation>S.timeLimit*0.8) noun='ギリギリまで悩んだ'+noun;
  const name=pick(ADJ)+noun+pick(SUF); return {name,bonus:(hashStr(name)%7)*15}; }
function scorePass(ok,f){ const parts={}; const m=f.meta;
  parts.hole = ok ? Math.round(clamp(0.6-f.minD,0,0.6)*420 + Math.min(f.holes,4)*35) : Math.round(clamp(0.3-f.minD,0,0.3)*120);
  parts.art = Math.round( Math.abs(f.spin.side)*140 + Math.max(0,f.spin.top)*60 + Math.min(f.bounces,2)*45 + Math.min(f.holes,4)*30 + (m.power>0.85?25:0) );
  const hes=clamp(m.hesitation/S.timeLimit,0,1);
  // 審査員C「ムダ」：迷い・変な出どころ・大きくズラす・ぐるぐる回しすぎ・引きすぎ・長押し・フェイク
  parts.muda = Math.round( hes*60 + m.relOff*50 + m.off*55 + (f.bounces>=2?25:0)
                         + Math.min(m.turns,4)*55 + Math.max(0,m.pullN-0.7)*90 + clamp(m.hold-0.9,0,3)*45 + Math.min(m.fakes,4)*40 );
  if(!ok){ parts.art=Math.round(parts.art*0.5); parts.muda=Math.round(parts.muda*0.5); }
  const nm=passName(f,ok); let total=0; const lines=[]; for(const j of S.judges){ const v=Math.round(parts[j.key]*j.w); total+=v; lines.push({j,raw:parts[j.key],v}); }
  const base= ok? 100*S.level : 0; total+=base+(ok?nm.bonus:0); return {total,base,lines,name:nm.name,bonus:nm.bonus}; }
function endFlight(ok,why){ const f=S.flight; if(f.done) return; f.done=true; const sc=scorePass(ok,f); S.score+=sc.total;
  const rec={level:S.level,ok,why,...sc}; S.history.push(rec); if(!S.best||sc.total>S.best.total) S.best=rec;
  S.timeScale = ok? 0.35 : 0.2; S.cam= ok? 'catch':'cut'; S.freeze=performance.now();
  if(ok) SFX.catch(); else if(why==='カットされた'){ SFX.cut(); const fl=$('flash'); fl.style.opacity=0.55; setTimeout(()=>fl.style.opacity=0,120); } else SFX.miss();
  setTimeout(()=>{ showMsg(ok? why+'！ +'+sc.total : why+'… +'+sc.total, '「'+sc.name+'」', ok, 1700); }, 350);
  if(!ok) S.turnovers++; updateHud();
  setTimeout(()=>{ S.timeScale=1; trail.visible=false; $('vig').style.opacity=0; if(!ok && S.turnovers>=3) return gameOver(false); if(ok){ S.level++; if(S.level>10) return gameOver(true); SFX.level(); } makeLevel(S.level); }, 2300);
}

// ---------------- flow ----------------
const bStart=$('bStart'), bShare=$('bShare'), bRetry=$('bRetry');
function startGame(){ ac(); S.mode='play'; S.level=1; S.score=0; S.turnovers=0; S.best=null; S.history=[]; S.cleared=false; S.rel=null; pid=null; S.stroke=null;
  title.classList.add('hidden'); resultEl.classList.add('hidden'); bStart.classList.add('hidden'); bShare.classList.add('hidden'); bRetry.classList.add('hidden'); hud.classList.remove('hidden'); muteBtn.classList.remove('hidden');
  makeLevel(1); updateHud(); }
function gameOver(cleared){ S.mode='result'; S.cleared=cleared; S.flight=null; SFX.over(); setPhase('flight'); lead.classList.add('hidden'); reach.visible=false; arrow.visible=arrowLine.visible=aimDot.visible=false; tapRing.visible=false;
  S.resultCard=buildResultCard(); $('card').src=S.resultCard.toDataURL('image/png'); resultEl.classList.remove('hidden'); bShare.classList.remove('hidden'); bRetry.classList.remove('hidden'); }
bStart.addEventListener('click',startGame); bRetry.addEventListener('click',startGame); bShare.addEventListener('click',shareResult);
function updateHud(){ $('lv').textContent='Lv '+S.level; $('sc').textContent=S.score+' 点'; $('to').textContent='ターンオーバー '+'●'.repeat(S.turnovers)+'○'.repeat(Math.max(0,3-S.turnovers)); }
const COMMENTS_OK=['見えてた。','針の穴、通ったな。','誰も頼んでないのに美しい。','今日は甘めに付けた。','なんで通るんだよ。','守備の手が遅かっただけ。','指先の勝利。'];
const COMMENTS_NG=['惜しくもない。','手に当てに行った。','ムダだけは満点。','審査員Cは寝ていた。','パスというより投擲。','強さだけは良かった。'];
function wrapText(g,text,x,y,maxW,lh){let line='';const lines=[];for(const ch of text){const t=line+ch;if(g.measureText(t).width>maxW){lines.push(line);line=ch;}else line=t;}lines.push(line);lines.forEach((l,i)=>g.fillText(l,x,y+i*lh));}
function buildResultCard(){ const w=900,h=1200,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle='#f3efe6';g.fillRect(0,0,w,h);g.strokeStyle='#222';g.lineWidth=6;g.strokeRect(30,30,w-60,h-60); g.fillStyle='#222';g.textAlign='center';
  g.font='bold 54px "Hiragino Sans","Yu Gothic",sans-serif';g.fillText('ハリノアナ',w/2,130); g.font='28px sans-serif';g.fillText('針の穴を通すパスのゲーム（審査員はバグっています）',w/2,180);
  g.font='bold 150px sans-serif';g.fillStyle='#e0552b';g.fillText(String(S.score),w/2,400); g.fillStyle='#222';g.font='bold 40px sans-serif';g.fillText(S.cleared?'Lv10 全クリア！':'Lv'+S.level+' で力尽きた',w/2,470);
  const best=S.best; g.font='bold 34px sans-serif';g.fillText('最高のパス',w/2,570); g.font='bold 44px sans-serif';g.fillStyle='#2b6cb0';wrapText(g,best?'「'+best.name+'」':'「パスを出さずに終わった」',w/2,630,w-140,52);
  g.fillStyle='#222';g.font='30px sans-serif'; if(best) g.fillText('+'+best.total+'点（名前ボーナス '+best.bonus+'）',w/2,760);
  g.font='28px sans-serif';let y=850; for(const l of (best?best.lines:[])){g.fillText(l.j.name+'〔'+l.j.mood+'〕 '+l.raw+' × '+l.j.w+' = '+l.v,w/2,y);y+=44;}
  g.font='italic 30px sans-serif';g.fillStyle='#555';g.fillText('審査員のひとこと：'+pick(S.cleared||(best&&best.ok)?COMMENTS_OK:COMMENTS_NG),w/2,1060); g.font='24px sans-serif';g.fillStyle='#888';g.fillText('#ハリノアナ',w/2,1130); return c; }
async function shareResult(){ const best=S.best; const text='ハリノアナ：'+S.score+'点（'+(S.cleared?'Lv10全クリア':'Lv'+S.level+'で終了')+'）。最高のパス「'+(best?best.name:'なし')+'」 #ハリノアナ'; const url=location.href.split('#')[0];
  try{ if(S.resultCard&&navigator.canShare){const blob=await new Promise(r=>S.resultCard.toBlob(r,'image/png'));const file=new File([blob],'harinoana.png',{type:'image/png'});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],text,url});return;}} if(navigator.share){await navigator.share({text,url});return;} }catch(e){return;}
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text+' '+url),'_blank'); }

// ---------------- 引いてる間のフィードバック ----------------
function updateAimUI(now){
  const R=releasePoint();
  // 到達板（脈打つ）
  reach.position.set(P.x+0.1, 1.3, REACH_Z());
  reach.material.opacity = S.phase==='drag' ? 0.20 : 0.16+0.08*Math.sin(now*0.006);
  if(S.phase==='ready'){ const ph=(now*0.0014)%1; tapRing.visible=true; tapRing.position.set(P.x+0.15,1.15,REACH_Z()+0.01); tapRing.lookAt(camera.position); tapRing.scale.setScalar(1+1.4*ph); tapRing.material.opacity=1-ph; }
  else tapRing.visible=false;
  if(S.phase==='ready'){ ball.position.copy(R); ball.position.y-=0.05; }
  else { ball.position.copy(R); grabRing.position.copy(R); grabRing.lookAt(camera.position); }
  // 予定軌道（回転込み・リアルタイム）
  const useP = S.phase==='drag' ? S.power : S.need;
  const useYaw = S.phase==='drag' ? S.yaw : 0, usePit = S.phase==='drag' ? S.pitch : 0.12;
  const useSpin = S.phase==='drag' ? S.spin : {side:0,top:0};
  const pts=[]; integrate(R, shotVelocity(R,useYaw,usePit,useP), useSpin, PRE_N, 0.055, pts);
  const arr=arrowGeo.attributes.position.array; for(let i=0;i<PRE_N;i++){ const q=pts[i]; arr[i*3]=q.x; arr[i*3+1]=q.y; arr[i*3+2]=q.z; }
  arrowGeo.attributes.position.needsUpdate=true; arrow.visible=arrowLine.visible=true;
  arrow.material.opacity = S.phase==='drag'? 0.95 : 0.45; arrowLine.material.opacity = S.phase==='drag'? 0.4 : 0.2;
  const land=pts[PRE_N-1]; aimDot.visible=true; aimDot.position.set(land.x, 0.02, land.z); aimDot.rotation.x=-Math.PI/2;
  aimDot.material.opacity = S.phase==='drag'? 0.95:0.45;
  if(S.phase!=='drag' || !S.stroke) return;
  const st=S.stroke;
  // ゴム紐
  const fp=screenToPlane(st.x,st.y,false);
  if(fp){ const ba=bandGeo.attributes.position.array; ba[0]=R.x; ba[1]=R.y; ba[2]=R.z; ba[3]=fp.x; ba[4]=fp.y; ba[5]=fp.z; bandGeo.attributes.position.needsUpdate=true; band.visible=true; }
  // 強さの弧（指の周り）
  pg.style.transform='translate('+st.x+'px,'+st.y+'px)';
  const good=Math.abs(S.power-S.need)<=GOOD_BAND;
  pgFg.setAttribute('stroke-dashoffset', String(PG_C*(1-clamp(S.power,0,1))));
  const lo=clamp(S.need-GOOD_BAND,0,1), hi=clamp(S.need+GOOD_BAND,0,1);
  pgBand.setAttribute('stroke-dasharray', (PG_C*(hi-lo))+' '+PG_C); pgBand.setAttribute('stroke-dashoffset', String(-PG_C*lo));
  pg.classList.toggle('good', good); pgLbl.textContent = good? 'OK' : (S.power<lo? '弱':'強');
  // 回転の渦
  const sside=S.spin.side;
  if(Math.abs(sside)>0.04){ swirl.visible=true; swirl.position.copy(R); swirl.lookAt(camera.position);
    swirl.rotateZ(now*0.004*Math.sign(sside)); swirl.scale.setScalar(0.9+Math.abs(sside)*0.3);
    swirl.material.opacity=clamp(0.3+Math.abs(sside),0,1); } else swirl.visible=false;
  if(S.spin.top>0.05){ dipMark.visible=true; dipMark.position.copy(R); dipMark.lookAt(camera.position); dipMark.scale.setScalar(0.8+S.spin.top*0.7); } else dipMark.visible=false;
  // 上部1行のサブ
  const bits=[]; if(Math.abs(sside)>0.15) bits.push(sside>0?'右カーブ':'左カーブ'); if(S.spin.top>0.15) bits.push('沈む');
  bits.push(good?'強さちょうどいい':(S.power<lo?'まだ弱い':'強すぎ'));
  setLead('そのまま払って離せ', bits.join(' / '));
}

// ---------------- loop ----------------
let lastT=performance.now(), simT=0;
function loop(now){
  const rdt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  const dt=rdt*S.timeScale; simT+=dt; const t=simT;
  if(S.mode==='play'){
    const ballInfo = S.flight && !S.flight.done ? {pos:S.flight.pos, near:S.flight.nearDef} : null;
    for(const d of figs.defs) poseDefender(d,t,d.spec,dt,ballInfo);
    poseMate(figs.mate,t,figs.mate.spec);
    if(S.flight && !S.flight.done){
      stepPhysics(dt);
      const near = S.flight.minD<0.5 && S.flight.nearDef && S.flight.pos.distanceTo(S.flight.nearDef.chest())<1.6;
      const targetScale = near? 0.22 : 1; S.timeScale = lerp(S.timeScale, targetScale, Math.min(1, rdt*8));
      $('vig').style.opacity = near? 1 : 0;
      if(near && !S.slowShown){ S.slowShown=true; showMsg('針の穴','',true,900,true); SFX.slow(); }
    } else if(S.flight && S.flight.done){ /* 余韻 */ }
    else {
      const remain=clamp(1-(now-S.levelStart)/1000/S.timeLimit,0,1);
      $('tbarFill').style.width=(remain*100)+'%'; $('tbarFill').classList.toggle('warn', remain<0.25);
      if(remain<=0){ pid=null; S.stroke=null;
        S.flight={pos:releasePoint(),vel:V(0,0,0),t:9,minD:9,holes:0,done:false,bounces:0,spin:{side:0,top:0},meta:{hesitation:S.timeLimit,power:0,off:0,relOff:0,turns:0,pullN:0,hold:0,fakes:S.fakes},trail:[]};
        setPhase('flight'); endFlight(false,'時間切れ'); }
      else updateAimUI(now);
    }
    if(S.cam==='player'){ camPlayer(); }
    else if(S.cam==='ball'){ const f=S.flight; const dir=f.vel.clone().normalize(); const want=f.pos.clone().sub(dir.clone().multiplyScalar(1.7)).add(V(0,0.55,0)); want.y=Math.max(0.35,want.y);
      S.camPos.lerp(want, Math.min(1,rdt*7)); const look=f.pos.clone().add(dir.multiplyScalar(2.5)); S.camLook.lerp(look, Math.min(1,rdt*9)); camera.position.copy(S.camPos); camera.lookAt(S.camLook); camera.fov=lerp(camera.fov, S.timeScale<0.6? 78:70, Math.min(1,rdt*5)); camera.updateProjectionMatrix(); }
    else if(S.cam==='catch'||S.cam==='cut'){ const c=S.flight.pos; const ang=(now-S.freeze)/1000*0.5 + Math.PI*0.25; const want=V(c.x+Math.sin(ang)*2.6, c.y+0.9, c.z+Math.cos(ang)*2.6); S.camPos.lerp(want,Math.min(1,rdt*6)); S.camLook.lerp(c,Math.min(1,rdt*8)); camera.position.copy(S.camPos); camera.lookAt(S.camLook); camera.fov=lerp(camera.fov,58,Math.min(1,rdt*4)); camera.updateProjectionMatrix(); }
  } else if(S.mode==='title'){
    camPlayer();
    if(figs.defs.length===0){ figs.mate=makePlayer(0xd23a3a,0xb02828,0xffffff); figs.mate.spec={x:0.8,z:P.z-7}; const d=makePlayer(0x1a1a1a,0x111111,0x222222); d.spec={baseX:0.1,x:0.1,z:P.z-3.2,amp:0.5,w:1.3,ph:0,vmax:2,wa:1.5,rt:0.3}; figs.defs.push(d); }
    for(const d of figs.defs) poseDefender(d,t,d.spec,dt,null); poseMate(figs.mate,t,figs.mate.spec); ball.position.copy(V(P.x+0.15,1.15,REACH_Z()));
  }
  renderer.render(scene,camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__H={S,figs,computeShot,levelSpec,newStroke,feedStroke}; // 検証用フック（headlessテストから参照）
</script>
