<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アノテーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #111;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  font-family: system-ui, sans-serif;
  overflow: hidden;
}

#toolbar {
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 10px;
  background: #1e1e1e;
  border-bottom: 1px solid #333;
  align-items: center;
}

.tool-btn {
  padding: 8px 12px;
  border: 2px solid transparent;
  border-radius: 8px;
  background: #2e2e2e;
  color: #ccc;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.1s;
}
.tool-btn:active { background: #3e3e3e; }
.tool-btn.active {
  background: #1a6bcc;
  color: #fff;
  border-color: #4a9eff;
}

#color-picker {
  width: 40px;
  height: 36px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  padding: 2px;
  background: #2e2e2e;
}

#stroke-size {
  width: 70px;
  accent-color: #4a9eff;
}

/* ツールのグループ区切り（ペン系／図形系／塗り系／その他） */
.sep { width: 2px; background: #4a4a4a; border-radius: 1px; margin: 2px 6px; align-self: stretch; }

#drop-zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #555;
  gap: 20px;
  text-align: center;
  padding: 30px;
}
#drop-zone h2 { font-size: 18px; color: #888; font-weight: 400; }
#drop-zone p { font-size: 13px; line-height: 1.8; }

.upload-btn {
  display: inline-block;
  padding: 12px 28px;
  background: #1a6bcc;
  color: white;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
  touch-action: manipulation;
}
.upload-btn:active { background: #1558a8; }
#file-input { display: none; }

#canvas-wrap {
  display: none;
  flex: 1;
  overflow: auto;
  padding: 12px;
  justify-content: center;
  align-items: flex-start;
}

canvas {
  cursor: crosshair;
  touch-action: none;
  display: block;
  max-width: 100%;
  border-radius: 4px;
}

#hint {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.75);
  color: #aaa;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 20px;
  pointer-events: none;
  white-space: nowrap;
}

/* 引き出し線テキストの入力オーバーレイ */
#text-editor {
  display: none;
  position: fixed;
  z-index: 50;
  background: #fff;
  color: #e00000;
  border: 2px solid #e00000;
  border-radius: 2px;
  font-family: "Noto Sans JP", sans-serif;
  font-weight: 700;
  line-height: 1.4;
  padding: 6px;
  resize: none;
  outline: none;
  overflow: hidden;
  min-width: 60px;
  white-space: pre;
}
</style>
</head>
<body>

<div id="toolbar">
  <!-- ペン系（自由・線） -->
  <button class="tool-btn" data-tool="pen">✏ ペン</button>
  <button class="tool-btn" data-tool="underline">／ 線</button>
  <button class="tool-btn" data-tool="arrow">➤ 矢印</button>
  <div class="sep"></div>
  <!-- 図形系（枠線） -->
  <button class="tool-btn" data-tool="rect">▭ 四角</button>
  <button class="tool-btn" data-tool="circle">○ 丸</button>
  <button class="tool-btn" data-tool="cloud">☁ 雲</button>
  <button class="tool-btn" data-tool="polygon">⬠ 多角形</button>
  <div class="sep"></div>
  <!-- 塗り系 -->
  <button class="tool-btn active" data-tool="black">■ 黒塗り</button>
  <button class="tool-btn" data-tool="mosaic">⊞ モザイク</button>
  <button class="tool-btn" data-tool="marker">▬ マーカー</button>
  <button class="tool-btn" data-tool="fillcircle">● 塗り丸</button>
  <button class="tool-btn" data-tool="fillcloud">🌩 塗り雲</button>
  <div class="sep"></div>
  <!-- その他 -->
  <button class="tool-btn" data-tool="callout">💬 引き出し</button>
  <button class="tool-btn" data-tool="trim">✂ トリム</button>
  <div class="sep"></div>
  <input type="color" id="color-picker" value="#ffff00" title="色">
  <input type="range" id="stroke-size" min="1" max="30" value="4" title="太さ">
  <div class="sep"></div>
  <button class="tool-btn" id="undo-btn">↩ 戻す</button>
  <button class="tool-btn" id="reset-btn">⟲ リセット</button>
  <button class="tool-btn" id="clear-btn">🗑 別の画像</button>
  <button class="tool-btn" id="copy-btn" style="background:#1a5c4a;color:#fff">📋 コピー</button>
  <button class="tool-btn" id="save-btn" style="background:#1a6bcc;color:#fff">💾 保存</button>
</div>

<div id="drop-zone">
  <h2>📋 画像を貼り付け・またはファイルを選択</h2>
  <p>Ctrl+V（PC）でスクショを貼り付け<br>スマホはファイル選択から</p>
  <label class="upload-btn">
    ファイルを選ぶ
    <input type="file" id="file-input" accept="image/*">
  </label>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div id="hint">ドラッグして範囲を指定</div>

<textarea id="text-editor" spellcheck="false"></textarea>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const toolbar = document.getElementById('toolbar');
const dropZone = document.getElementById('drop-zone');
const canvasWrap = document.getElementById('canvas-wrap');
const colorPicker = document.getElementById('color-picker');
const strokeSize = document.getElementById('stroke-size');
const hint = document.getElementById('hint');
const textEditor = document.getElementById('text-editor');

let currentTool = 'black';
let drawing = false;
let startX = 0, startY = 0;
let undoStack = [];
let snapshot = null;
let dragTool = null;        // ドラッグ開始時のツール（途中でツールが変わっても確定は開始時のもの）
let lastPos = null;        // 直近のポインタ位置（Shift 押下／解放でプレビューを描き直すため）
let lastShift = false;
// Shift で縦横を揃える（正円・正方形）ツール
const SQUARE_TOOLS = new Set(['circle', 'rect', 'cloud', 'fillcircle', 'fillcloud']);
// Shift 押下でプレビューが変わるツール（underline は水平・垂直スナップ）
const SHIFT_TOOLS = new Set([...SQUARE_TOOLS, 'underline']);
let originalState = null;   // 画像読み込み直後の状態（リセット用・スタックから外れても保持）
const UNDO_MAX_BYTES = 256 * 1024 * 1024;

// 多角形ツール
let polyPts = [];
let polyBase = null;        // 多角形開始前のキャンバス内容
let lastTouch = false;      // 直近の入力がタッチか（スナップ半径の切替用）
const POLY_SNAP_CSS = 12;   // 起点スナップ半径（画面CSSpx／マウス）
const POLY_SNAP_CSS_TOUCH = 24; // 同（指タッチ）
const POLY_DUP_CSS = 4;     // 重複クリック判定（画面CSSpx）

// 引き出し線テキスト
let calloutTarget = null;   // 指し先（クリック1）
let calloutBase = null;     // 引き出し開始前のキャンバス内容
let calloutBox = null;      // ボックス左上（クリック2）
const CALLOUT_FONT_PX = 16; // 12pt = 16px
const CALLOUT_COLOR = '#e00000';
const CALLOUT_PAD = 6;
const CALLOUT_BORDER = 2;
const CALLOUT_FONT = `700 ${CALLOUT_FONT_PX}px "Noto Sans JP", sans-serif`;

const hints = {
  black: 'ドラッグして黒塗り範囲を指定',
  mosaic: 'ドラッグしてモザイク範囲を指定',
  marker: 'ドラッグしてハイライト範囲を指定',
  underline: 'ドラッグして線を引く（Shiftで水平・垂直）',
  circle: 'ドラッグして丸を描く（Shiftで正円）',
  rect: 'ドラッグして四角を描く（Shiftで正方形）',
  cloud: 'ドラッグして雲を描く（Shiftで正方形範囲）',
  fillcircle: 'ドラッグして塗りつぶしの丸を描く（Shiftで正円）',
  fillcloud: 'ドラッグして塗りつぶしの雲を描く（Shiftで正方形範囲）',
  pen: 'なぞってフリーハンド描画',
  arrow: 'ドラッグして矢印を描く（始点→終点）',
  polygon: 'クリックで頂点を追加／起点クリック・ダブルクリック・Enterで閉じる（Escで中断）',
  callout: 'クリック1＝指し先、クリック2＝ボックス位置、入力してEnter（Escで中断）',
  trim: 'ドラッグしてトリミング範囲を指定',
};

// ツール切替
document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    cancelPending();
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTool = btn.dataset.tool;
    hint.textContent = hints[currentTool] || '';
  });
});

// 進行中のドラッグ描画を打ち切る（undo・画像差し替え・ツール切替で古い snapshot が
// 生き残り、リリース時に消したはずの図形が復活する事故を防ぐ）
function abortDrag() {
  drawing = false;
  snapshot = null;
  dragTool = null;
  lastPos = null;
  lastShift = false;
}

// 進行中の多角形・引き出し線を破棄して元の描画に戻す
function cancelPending() {
  if (polyBase) ctx.putImageData(polyBase, 0, 0);
  else if (calloutBase) ctx.putImageData(calloutBase, 0, 0);
  discardPending();
}

// 進行中の状態だけ捨てる（キャンバスは触らない＝画像入れ替え・undo時用）
function discardPending() {
  abortDrag();
  polyPts = []; polyBase = null;
  calloutTarget = null; calloutBase = null; calloutBox = null;
  textEditor.style.display = 'none';
  textEditor.value = '';
}

// 画像ロード
function loadImage(img) {
  canvas.width = img.naturalWidth || img.width;
  canvas.height = img.naturalHeight || img.height;
  ctx.drawImage(img, 0, 0);
  dropZone.style.display = 'none';
  canvasWrap.style.display = 'flex';
  toolbar.style.display = 'flex';
  undoStack = [];
  discardPending();
  saveState();
  originalState = undoStack[0];
  hint.textContent = hints[currentTool];
}

// クリップボードペースト
document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => loadImage(img);
      img.src = url;
      e.preventDefault();
      break;
    }
  }
});

// ファイル選択
document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => loadImage(img);
  img.src = url;
  e.target.value = '';
});

// Undo（トリムでキャンバスサイズが変わるので寸法ごと積む）
function saveState() {
  undoStack.push({
    w: canvas.width,
    h: canvas.height,
    data: ctx.getImageData(0, 0, canvas.width, canvas.height),
  });
  if (undoStack.length > 30) undoStack.shift();
  // 大きな画像で 30 面分を抱えるとGB級になるので総バイト数でも上限を掛ける
  // （最低2面は必ず残す＝直前へは必ず戻れる）
  let bytes = undoStack.reduce((n, s) => n + s.w * s.h * 4, 0);
  while (undoStack.length > 2 && bytes > UNDO_MAX_BYTES) {
    const s = undoStack.shift();
    bytes -= s.w * s.h * 4;
  }
}

function restoreState(s) {
  if (canvas.width !== s.w || canvas.height !== s.h) {
    canvas.width = s.w;
    canvas.height = s.h;
  }
  ctx.putImageData(s.data, 0, 0);
}

document.getElementById('undo-btn').addEventListener('click', () => {
  // 進行中の多角形／引き出しがあれば、まずそれを取り消す
  if (polyBase || calloutBase) { cancelPending(); return; }
  abortDrag(); // ドラッグ途中の undo で古い snapshot が復活しないように

  if (undoStack.length <= 1) return;
  undoStack.pop();
  restoreState(undoStack[undoStack.length - 1]);
});

// リセット（画像読み込み直後へ。confirm は出さず undo で戻せる）
document.getElementById('reset-btn').addEventListener('click', () => {
  if (!originalState) return;
  cancelPending();
  restoreState(originalState);
  saveState();
  hint.textContent = '⟲ 元の画像に戻しました（↩戻すで取り消せます）';
  setTimeout(() => { hint.textContent = hints[currentTool] || ''; }, 2000);
});

// 別の画像
document.getElementById('clear-btn').addEventListener('click', () => {
  discardPending();
  canvasWrap.style.display = 'none';
  toolbar.style.display = 'none';
  dropZone.style.display = 'flex';
  undoStack = [];
  originalState = null;
});

// クリップボードにコピー
document.getElementById('copy-btn').addEventListener('click', () => {
  cancelPending(); // 未確定プレビュー（頂点マーカー等）を出力に混ぜない
  canvas.toBlob(async (blob) => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      hint.textContent = '📋 コピーしました！';
    } catch {
      hint.textContent = 'コピー失敗（ブラウザ権限を確認してください）';
    }
    setTimeout(() => { hint.textContent = hints[currentTool]; }, 2000);
  });
});

// 保存
document.getElementById('save-btn').addEventListener('click', () => {
  cancelPending(); // 未確定プレビューを保存に混ぜない
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
  a.download = `annotated-${ts}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
});

// 座標取得（マウス／タッチ両対応）
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let cx, cy;
  if (e.changedTouches?.length) {
    cx = e.changedTouches[0].clientX;
    cy = e.changedTouches[0].clientY;
  } else if (e.touches?.length) {
    cx = e.touches[0].clientX;
    cy = e.touches[0].clientY;
  } else {
    cx = e.clientX;
    cy = e.clientY;
  }
  return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
}

// 描画
canvas.addEventListener('mousedown', onStart);
canvas.addEventListener('touchstart', onStart, { passive: false });
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('mouseup', onEnd);
canvas.addEventListener('touchend', onEnd);
// キャンバスの外でボタンを離してもドラッグを確定させる（drawing 中でなければ即 return）
window.addEventListener('mouseup', onEnd);
window.addEventListener('touchend', onEnd);
// スワイプ中断・通話着信等で touch が失われた時は描きかけを捨てる
window.addEventListener('touchcancel', () => {
  if (!drawing) return;
  if (snapshot) ctx.putImageData(snapshot, 0, 0);
  abortDrag();
});

function onStart(e) {
  e.preventDefault();

  // クリック型ツール（ドラッグ描画には入らない）
  const isTouch = !!(e.touches || e.changedTouches);
  if (currentTool === 'polygon') { handlePolyClick(getPos(e), isTouch); return; }
  if (currentTool === 'callout') { handleCalloutClick(getPos(e)); return; }

  drawing = true;
  dragTool = currentTool;
  const p = getPos(e);
  startX = p.x;
  startY = p.y;
  snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  lastPos = p;
  lastShift = !!e.shiftKey;

  if (currentTool === 'pen') {
    ctx.beginPath();
    ctx.moveTo(startX, startY);
  }
}

function onMove(e) {
  // 多角形：確定済み頂点＋カーソルまでのラバーバンドをプレビュー
  if (currentTool === 'polygon' && polyPts.length) {
    e.preventDefault();
    drawPolyPreview(getPos(e));
    return;
  }
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);

  if (currentTool === 'pen') {
    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = parseInt(strokeSize.value);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    return;
  }

  lastPos = p;
  lastShift = !!e.shiftKey;
  renderShape(p.x, p.y, lastShift);
}

// ドラッグ系ツールのプレビュー／確定描画（プレビューと確定で同じ絵になるよう一本化）
function renderShape(rawX, rawY, shift) {
  if (!snapshot) return;
  const tool = dragTool || currentTool;
  const c = SQUARE_TOOLS.has(tool) ? constrain(rawX, rawY, shift) : { x: rawX, y: rawY };
  const x = c.x, y = c.y;

  ctx.putImageData(snapshot, 0, 0);
  const w = x - startX, h = y - startY;
  const lw = parseInt(strokeSize.value);

  ctx.save(); // lineJoin/lineCap/lineDash 等をツール間で持ち越さない
  switch (tool) {
    case 'black':
      ctx.fillStyle = '#000';
      ctx.fillRect(startX, startY, w, h);
      break;
    case 'mosaic':
      // プレビュー: 赤枠
      ctx.strokeStyle = 'rgba(255,50,50,0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 3]);
      ctx.strokeRect(startX, startY, w, h);
      ctx.setLineDash([]);
      break;
    case 'marker':
      ctx.fillStyle = hexToRgba(colorPicker.value, 0.4);
      ctx.fillRect(startX, startY, w, h);
      break;
    case 'underline': {
      // Shift 押下時だけ水平・垂直にスナップ（移動量が大きい方に揃える）
      const snap = !!shift;
      const endX = snap ? (Math.abs(w) >= Math.abs(h) ? x : startX) : x;
      const endY = snap ? (Math.abs(w) >= Math.abs(h) ? startY : y) : y;
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = lw;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      break;
    }
    case 'circle':
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.ellipse(
        startX + w / 2, startY + h / 2,
        Math.abs(w / 2), Math.abs(h / 2),
        0, 0, Math.PI * 2
      );
      ctx.stroke();
      break;
    case 'fillcircle':
      ctx.fillStyle = colorPicker.value;
      ctx.beginPath();
      ctx.ellipse(
        startX + w / 2, startY + h / 2,
        Math.abs(w / 2), Math.abs(h / 2),
        0, 0, Math.PI * 2
      );
      ctx.fill();
      break;
    case 'rect':
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = lw;
      ctx.strokeRect(startX, startY, w, h);
      break;
    case 'cloud':
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = lw;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      cloudPath(startX, startY, w, h);
      ctx.stroke();
      break;
    case 'fillcloud':
      ctx.fillStyle = colorPicker.value;
      cloudPath(startX, startY, w, h);
      ctx.fill();
      break;
    case 'arrow':
      drawArrowShape(startX, startY, x, y, colorPicker.value, lw);
      break;
    case 'trim': {
      const trx = Math.min(startX, startX + w);
      const try_ = Math.min(startY, startY + h);
      const trw = Math.abs(w), trh = Math.abs(h);
      // 範囲外を暗くする
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, canvas.width, try_);
      ctx.fillRect(0, try_ + trh, canvas.width, canvas.height - try_ - trh);
      ctx.fillRect(0, try_, trx, trh);
      ctx.fillRect(trx + trw, try_, canvas.width - trx - trw, trh);
      // 白い外枠 → 水色内枠でどんな背景でも見える二重ライン
      ctx.lineWidth = 3;
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeRect(trx - 1, try_ - 1, trw + 2, trh + 2);
      ctx.lineWidth = 1.5;
      ctx.setLineDash([8, 4]);
      ctx.strokeStyle = 'rgba(0,180,255,1)';
      ctx.strokeRect(trx, try_, trw, trh);
      ctx.setLineDash([]);
      // コーナーハンドル（8px四角）
      ctx.fillStyle = '#fff';
      const corners = [[trx,try_],[trx+trw,try_],[trx,try_+trh],[trx+trw,try_+trh]];
      corners.forEach(([cx,cy]) => ctx.fillRect(cx - 5, cy - 5, 10, 10));
      ctx.strokeStyle = 'rgba(0,180,255,1)';
      ctx.lineWidth = 1.5;
      corners.forEach(([cx,cy]) => ctx.strokeRect(cx - 5, cy - 5, 10, 10));
      break;
    }
  }
  ctx.restore();
}

function onEnd(e) {
  if (!drawing) return;
  drawing = false;
  const tool = dragTool || currentTool;

  // Shift の効くツールだけ、最終位置＋最終Shift状態で描き直す
  // （プレビューと確定結果を必ず一致させる。他ツールは既存どおり最後の move の絵をそのまま確定）
  if (SHIFT_TOOLS.has(tool)) {
    const shift = typeof e.shiftKey === 'boolean' ? e.shiftKey : lastShift;
    const p = getPos(e);
    renderShape(p.x, p.y, shift);
  }
  lastPos = null; lastShift = false;

  if (tool === 'mosaic') {
    const p = getPos(e);
    ctx.putImageData(snapshot, 0, 0);
    applyMosaic(startX, startY, p.x - startX, p.y - startY);
  }

  if (tool === 'trim') {
    const p = getPos(e);
    ctx.putImageData(snapshot, 0, 0);
    const rx = Math.round(Math.min(startX, p.x));
    const ry = Math.round(Math.min(startY, p.y));
    const rw = Math.round(Math.abs(p.x - startX));
    const rh = Math.round(Math.abs(p.y - startY));
    if (rw > 4 && rh > 4) {
      const cropped = ctx.getImageData(rx, ry, rw, rh);
      canvas.width = rw;
      canvas.height = rh;
      ctx.putImageData(cropped, 0, 0);
      // undo スタックは捨てない＝トリムも1手として戻せる
      saveState();
      snapshot = null; dragTool = null;
      hint.textContent = hints[currentTool];
      return;
    }
  }

  saveState();
  snapshot = null; dragTool = null;
}

function applyMosaic(x, y, w, h) {
  const rx = Math.round(Math.min(x, x + w));
  const ry = Math.round(Math.min(y, y + h));
  const rw = Math.round(Math.abs(w));
  const rh = Math.round(Math.abs(h));
  if (rw < 1 || rh < 1) return;

  const block = Math.max(6, Math.floor(Math.min(rw, rh) / 12));
  const data = ctx.getImageData(rx, ry, rw, rh);
  const d = data.data;

  for (let bx = 0; bx < rw; bx += block) {
    for (let by = 0; by < rh; by += block) {
      const i = (by * rw + bx) * 4;
      const r = d[i], g = d[i+1], b = d[i+2];
      const maxBx = Math.min(bx + block, rw);
      const maxBy = Math.min(by + block, rh);
      for (let px = bx; px < maxBx; px++) {
        for (let py = by; py < maxBy; py++) {
          const j = (py * rw + px) * 4;
          d[j] = r; d[j+1] = g; d[j+2] = b;
        }
      }
    }
  }
  ctx.putImageData(data, rx, ry);
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

// Shift 拘束：ドラッグ方向の符号は保ったまま縦横を max(|dx|,|dy|) に揃える
function constrain(x, y, shift) {
  if (!shift) return { x, y };
  const dx = x - startX, dy = y - startY;
  const m = Math.max(Math.abs(dx), Math.abs(dy));
  return {
    x: startX + (dx < 0 ? -m : m),
    y: startY + (dy < 0 ? -m : m),
  };
}

// Shift の押下／解放でプレビューを即座に更新（マウスを動かさなくても効く）
function onShiftToggle(e) {
  if (e.key !== 'Shift') return;
  if (!drawing || !lastPos || !snapshot || !SHIFT_TOOLS.has(dragTool || currentTool)) return;
  lastShift = (e.type === 'keydown');
  renderShape(lastPos.x, lastPos.y, lastShift);
}
window.addEventListener('keydown', onShiftToggle);
window.addEventListener('keyup', onShiftToggle);

// ☁ リビジョン雲：楕円の外周を円弧（2次ベジェ）の連なりで描く
// pdf-master/index.html の cloudPath() を canvas パスへ移植
function cloudPath(x, y, w, h) {
  const aw = Math.abs(w), ah = Math.abs(h);
  const cx = x + w / 2, cy = y + h / 2;
  // 元実装は 14 分割だが、16 にすると 0°/90°/180°/270° に頂点が乗り
  // Shift（正方形）時に縦横の膨らみが揃う
  const n = 16;
  const r = Math.min(aw, ah) * 0.12;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a1 = i / n * Math.PI * 2, a2 = (i + 1) / n * Math.PI * 2;
    const px = cx + aw / 2 * Math.cos(a1), py = cy + ah / 2 * Math.sin(a1);
    const px2 = cx + aw / 2 * Math.cos(a2), py2 = cy + ah / 2 * Math.sin(a2);
    const mid = (a1 + a2) / 2;
    const mx = (px + px2) / 2 + r * Math.cos(mid) * 1.8;
    const my = (py + py2) / 2 + r * Math.sin(mid) * 1.8;
    if (!i) ctx.moveTo(px, py);
    ctx.quadraticCurveTo(mx, my, px2, py2);
  }
  ctx.closePath();
}

// ➤ 矢印: 軸線＋矢頭（太さに連動）
function drawArrowShape(x1, y1, x2, y2, color, lw) {
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const head = Math.max(12, lw * 3.2);   // 矢頭は太さに連動
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = lw;
  ctx.lineCap = 'round';
  // 軸線は矢頭に少し食い込ませない程度で止める
  const lx = x2 - Math.cos(ang) * head * 0.6;
  const ly = y2 - Math.sin(ang) * head * 0.6;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(lx, ly);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - Math.cos(ang - 0.42) * head, y2 - Math.sin(ang - 0.42) * head);
  ctx.lineTo(x2 - Math.cos(ang + 0.42) * head, y2 - Math.sin(ang + 0.42) * head);
  ctx.closePath();
  ctx.fill();
}

/* ============ 多角形ツール ============ */
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

// 画面CSSpx → キャンバスpx の倍率（大きい画像を縮小表示していても操作感を一定に）
function pxScale() {
  const rect = canvas.getBoundingClientRect();
  return rect.width > 0 ? canvas.width / rect.width : 1;
}
function polySnapR(touch) {
  return (touch ? POLY_SNAP_CSS_TOUCH : POLY_SNAP_CSS) * pxScale();
}

function handlePolyClick(p, touch) {
  if (!polyPts.length) {
    polyBase = ctx.getImageData(0, 0, canvas.width, canvas.height);
    polyPts = [p];
    lastTouch = !!touch;
    drawPolyPreview(null);
    return;
  }
  lastTouch = !!touch;
  // ダブルクリックの2発目など、ほぼ同じ位置の重複クリックは無視
  if (dist(p, polyPts[polyPts.length - 1]) < POLY_DUP_CSS * pxScale()) return;
  // 起点スナップで閉じる
  if (polyPts.length >= 2 && dist(p, polyPts[0]) <= polySnapR(touch)) { closePolygon(); return; }
  polyPts.push(p);
  drawPolyPreview(null);
}

function strokePolyPath(closed, cur) {
  ctx.beginPath();
  ctx.moveTo(polyPts[0].x, polyPts[0].y);
  for (let i = 1; i < polyPts.length; i++) ctx.lineTo(polyPts[i].x, polyPts[i].y);
  if (cur) ctx.lineTo(cur.x, cur.y);
  if (closed) ctx.closePath();
  ctx.stroke();
}

function drawPolyPreview(cur) {
  if (!polyBase || !polyPts.length) return;
  ctx.putImageData(polyBase, 0, 0);
  ctx.setLineDash([]);
  ctx.strokeStyle = colorPicker.value;
  ctx.lineWidth = parseInt(strokeSize.value);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (polyPts.length > 1 || cur) strokePolyPath(false, cur);
  // 起点マーカー（スナップ圏内なら強調）
  const sr = polySnapR(lastTouch);
  const near = !!cur && polyPts.length >= 2 && dist(cur, polyPts[0]) <= sr;
  ctx.beginPath();
  ctx.arc(polyPts[0].x, polyPts[0].y, near ? sr : sr / 2, 0, Math.PI * 2);
  ctx.lineWidth = Math.max(2, 2 * pxScale());
  ctx.strokeStyle = near ? 'rgba(0,224,255,1)' : 'rgba(255,255,255,0.9)';
  ctx.stroke();
}

function closePolygon() {
  if (!polyBase) return;
  if (polyPts.length < 3) { cancelPending(); return; }
  ctx.putImageData(polyBase, 0, 0);
  ctx.setLineDash([]);
  ctx.strokeStyle = colorPicker.value;
  ctx.lineWidth = parseInt(strokeSize.value);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  strokePolyPath(true, null);
  discardPending();
  saveState();
}

canvas.addEventListener('dblclick', (e) => {
  if (currentTool !== 'polygon') return;
  e.preventDefault();
  closePolygon();
});

/* ============ 引き出し線テキスト ============ */
function handleCalloutClick(p) {
  if (textEditor.style.display === 'block') return; // 入力中（blur で確定される）
  if (!calloutTarget) {
    calloutBase = ctx.getImageData(0, 0, canvas.width, canvas.height);
    calloutTarget = p;
    // 指し先マーカー（プレビューのみ）
    ctx.fillStyle = CALLOUT_COLOR;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(4, 4 * pxScale()), 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  calloutBox = p;
  openTextEditor(p);
}

function placeTextEditor() {
  if (!calloutBox || textEditor.style.display !== 'block') return;
  const rect = canvas.getBoundingClientRect();
  const s = rect.width / canvas.width;
  textEditor.style.left = (rect.left + calloutBox.x * s) + 'px';
  textEditor.style.top = (rect.top + calloutBox.y * s) + 'px';
  textEditor.style.fontSize = (CALLOUT_FONT_PX * s) + 'px';
  textEditor.style.padding = (CALLOUT_PAD * s) + 'px';
  textEditor.style.borderWidth = (CALLOUT_BORDER * s) + 'px';
}

// スクロール・リサイズ・スマホのソフトキーボードで位置がズレないよう追随させる
canvasWrap.addEventListener('scroll', placeTextEditor);
window.addEventListener('resize', placeTextEditor);
window.addEventListener('scroll', placeTextEditor, true);
window.visualViewport?.addEventListener('resize', placeTextEditor);
window.visualViewport?.addEventListener('scroll', placeTextEditor);

function openTextEditor(p) {
  textEditor.value = '';
  textEditor.style.display = 'block';
  placeTextEditor();
  textEditor.rows = 1;
  textEditor.style.height = 'auto';
  textEditor.focus();
  hint.textContent = 'テキストを入力 → Enterで確定（Shift+Enterで改行・Escで中断）';
}

textEditor.addEventListener('input', () => {
  textEditor.style.height = 'auto';
  textEditor.style.height = textEditor.scrollHeight + 'px';
});

textEditor.addEventListener('keydown', (e) => {
  e.stopPropagation();
  // 入力中の Ctrl/Cmd+S でブラウザの「ページを保存」を開かせない → 確定して保存へ
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    commitCallout();
    document.getElementById('save-btn').click();
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitCallout(); }
  if (e.key === 'Escape') { e.preventDefault(); cancelPending(); hint.textContent = hints[currentTool] || ''; }
});

textEditor.addEventListener('blur', () => {
  if (textEditor.style.display !== 'block') return;
  if (textEditor.value.trim()) commitCallout();
  else { cancelPending(); hint.textContent = hints[currentTool] || ''; }
});

function commitCallout() {
  if (textEditor.style.display !== 'block') return;
  const text = textEditor.value.replace(/\s+$/, '');
  const target = calloutTarget, box = calloutBox, base = calloutBase;
  textEditor.style.display = 'none';
  if (!text || !target || !box || !base) { cancelPending(); return; }
  ctx.putImageData(base, 0, 0);
  drawCallout(target, box, text);
  discardPending();
  saveState();
  hint.textContent = hints[currentTool] || '';
}

// ボックス中心→指し先 の直線が矩形の辺と交わる点
function rectEdgePoint(x, y, w, h, target) {
  const cx = x + w / 2, cy = y + h / 2;
  const dx = target.x - cx, dy = target.y - cy;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const tx = dx !== 0 ? (w / 2) / Math.abs(dx) : Infinity;
  const ty = dy !== 0 ? (h / 2) / Math.abs(dy) : Infinity;
  const t = Math.min(tx, ty, 1);
  return { x: cx + dx * t, y: cy + dy * t };
}

function drawCallout(target, box, text) {
  const lines = text.split('\n');
  const lh = Math.round(CALLOUT_FONT_PX * 1.4);
  ctx.save();
  ctx.setLineDash([]);
  ctx.font = CALLOUT_FONT;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  let maxW = 0;
  lines.forEach(l => { maxW = Math.max(maxW, ctx.measureText(l).width); });
  const bw = Math.ceil(maxW) + CALLOUT_PAD * 2;
  const bh = lines.length * lh + CALLOUT_PAD * 2;
  const bx = box.x, by = box.y;
  // 引き出し線（ボックスの下に隠れるよう先に描く）
  const edge = rectEdgePoint(bx, by, bw, bh, target);
  ctx.strokeStyle = CALLOUT_COLOR;
  ctx.lineWidth = CALLOUT_BORDER;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(edge.x, edge.y);
  ctx.lineTo(target.x, target.y);
  ctx.stroke();
  // ボックス（白塗り・赤枠）
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeRect(bx, by, bw, bh);
  // テキスト（赤・太字）
  ctx.fillStyle = CALLOUT_COLOR;
  lines.forEach((l, i) => ctx.fillText(l, bx + CALLOUT_PAD, by + CALLOUT_PAD + i * lh));
  ctx.restore();
}

// Noto Sans JP を先読み（未搭載環境では sans-serif に落ちる）
if (document.fonts?.load) {
  document.fonts.load(CALLOUT_FONT, 'あ').catch(() => {});
}

// キーボードショートカット
document.addEventListener('keydown', (e) => {
  // 文字入力中のみショートカットを止める（color/range/file にフォーカスが
  // 残っていても v1 どおりショートカットが効くこと）
  const t = e.target;
  const typing = t && (t.tagName === 'TEXTAREA' ||
    (t.tagName === 'INPUT' && ['text', 'search', 'url', 'email', 'number', 'password'].includes(t.type)));
  if (typing) return;

  if (e.key === 'Enter' && currentTool === 'polygon' && polyPts.length) {
    e.preventDefault();
    closePolygon();
    return;
  }
  if (e.key === 'Escape') {
    if (polyBase || calloutBase) {
      e.preventDefault();
      cancelPending();
      hint.textContent = hints[currentTool] || '';
    }
    return;
  }

  if (e.ctrlKey && e.key === 'z') {
    e.preventDefault();
    document.getElementById('undo-btn').click();
  }
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    document.getElementById('save-btn').click();
  }
  // 上下キーで太さ変更（描画中でも有効）
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    strokeSize.value = Math.min(30, parseInt(strokeSize.value) + 1);
    hint.textContent = `太さ: ${strokeSize.value}`;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    strokeSize.value = Math.max(1, parseInt(strokeSize.value) - 1);
    hint.textContent = `太さ: ${strokeSize.value}`;
  }
  // 既存の割当（1〜9／0／a）は筋肉記憶保護のため変更しない。新ツールは空き文字キーへ
  const keys = {
    '1':'black','2':'mosaic','3':'marker','4':'underline','5':'circle','6':'pen',
    '7':'trim','8':'polygon','9':'callout','0':'rect','a':'arrow',
    'c':'cloud','f':'fillcircle','g':'fillcloud',
  };
  if (keys[e.key]) {
    const btn = document.querySelector(`[data-tool="${keys[e.key]}"]`);
    if (btn) btn.click();
  }
});
</script>
</body>
</html>
