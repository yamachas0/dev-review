<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アノテーター</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #111;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  font-family: system-ui, sans-serif;
  overflow: hidden;
}

#toolbar {
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 10px;
  background: #1e1e1e;
  border-bottom: 1px solid #333;
  align-items: center;
}

.tool-btn {
  padding: 8px 12px;
  border: 2px solid transparent;
  border-radius: 8px;
  background: #2e2e2e;
  color: #ccc;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: background 0.1s;
}
.tool-btn:active { background: #3e3e3e; }
.tool-btn.active {
  background: #1a6bcc;
  color: #fff;
  border-color: #4a9eff;
}

#color-picker {
  width: 40px;
  height: 36px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  padding: 2px;
  background: #2e2e2e;
}

#stroke-size {
  width: 70px;
  accent-color: #4a9eff;
}

.sep { width: 1px; background: #444; margin: 2px 2px; align-self: stretch; }

#drop-zone {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #555;
  gap: 20px;
  text-align: center;
  padding: 30px;
}
#drop-zone h2 { font-size: 18px; color: #888; font-weight: 400; }
#drop-zone p { font-size: 13px; line-height: 1.8; }

.upload-btn {
  display: inline-block;
  padding: 12px 28px;
  background: #1a6bcc;
  color: white;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
  touch-action: manipulation;
}
.upload-btn:active { background: #1558a8; }
#file-input { display: none; }

#canvas-wrap {
  display: none;
  flex: 1;
  overflow: auto;
  padding: 12px;
  justify-content: center;
  align-items: flex-start;
}

canvas {
  cursor: crosshair;
  touch-action: none;
  display: block;
  max-width: 100%;
  border-radius: 4px;
}

#hint {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.75);
  color: #aaa;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 20px;
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="toolbar">
  <button class="tool-btn active" data-tool="black">■ 黒塗り</button>
  <button class="tool-btn" data-tool="mosaic">⊞ モザイク</button>
  <button class="tool-btn" data-tool="marker">▬ マーカー</button>
  <button class="tool-btn" data-tool="underline">／ 線</button>
  <button class="tool-btn" data-tool="circle">○ 丸</button>
  <button class="tool-btn" data-tool="pen">✏ ペン</button>
  <button class="tool-btn" data-tool="trim">✂ トリム</button>
  <div class="sep"></div>
  <input type="color" id="color-picker" value="#ffff00" title="色">
  <input type="range" id="stroke-size" min="1" max="30" value="4" title="太さ">
  <div class="sep"></div>
  <button class="tool-btn" id="undo-btn">↩ 戻す</button>
  <button class="tool-btn" id="clear-btn">🗑 別の画像</button>
  <button class="tool-btn" id="copy-btn" style="background:#1a5c4a;color:#fff">📋 コピー</button>
  <button class="tool-btn" id="save-btn" style="background:#1a6bcc;color:#fff">💾 保存</button>
</div>

<div id="drop-zone">
  <h2>📋 画像を貼り付け・またはファイルを選択</h2>
  <p>Ctrl+V（PC）でスクショを貼り付け<br>スマホはファイル選択から</p>
  <label class="upload-btn">
    ファイルを選ぶ
    <input type="file" id="file-input" accept="image/*">
  </label>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<div id="hint">ドラッグして範囲を指定</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const toolbar = document.getElementById('toolbar');
const dropZone = document.getElementById('drop-zone');
const canvasWrap = document.getElementById('canvas-wrap');
const colorPicker = document.getElementById('color-picker');
const strokeSize = document.getElementById('stroke-size');
const hint = document.getElementById('hint');

let currentTool = 'black';
let drawing = false;
let startX = 0, startY = 0;
let undoStack = [];
let snapshot = null;

const hints = {
  black: 'ドラッグして黒塗り範囲を指定',
  mosaic: 'ドラッグしてモザイク範囲を指定',
  marker: 'ドラッグしてハイライト範囲を指定',
  underline: 'ドラッグして線を引く',
  circle: 'ドラッグして丸を描く',
  pen: 'なぞってフリーハンド描画',
  trim: 'ドラッグしてトリミング範囲を指定',
};

// ツール切替
document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTool = btn.dataset.tool;
    hint.textContent = hints[currentTool] || '';
  });
});

// 画像ロード
function loadImage(img) {
  canvas.width = img.naturalWidth || img.width;
  canvas.height = img.naturalHeight || img.height;
  ctx.drawImage(img, 0, 0);
  dropZone.style.display = 'none';
  canvasWrap.style.display = 'flex';
  toolbar.style.display = 'flex';
  undoStack = [];
  saveState();
  hint.textContent = hints[currentTool];
}

// クリップボードペースト
document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const blob = item.getAsFile();
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => loadImage(img);
      img.src = url;
      e.preventDefault();
      break;
    }
  }
});

// ファイル選択
document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => loadImage(img);
  img.src = url;
  e.target.value = '';
});

// Undo
function saveState() {
  undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
  if (undoStack.length > 30) undoStack.shift();
}

document.getElementById('undo-btn').addEventListener('click', () => {
  if (undoStack.length <= 1) return;
  undoStack.pop();
  ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
});

// 別の画像
document.getElementById('clear-btn').addEventListener('click', () => {
  canvasWrap.style.display = 'none';
  toolbar.style.display = 'none';
  dropZone.style.display = 'flex';
  undoStack = [];
});

// クリップボードにコピー
document.getElementById('copy-btn').addEventListener('click', () => {
  canvas.toBlob(async (blob) => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      hint.textContent = '📋 コピーしました！';
    } catch {
      hint.textContent = 'コピー失敗（ブラウザ権限を確認してください）';
    }
    setTimeout(() => { hint.textContent = hints[currentTool]; }, 2000);
  });
});

// 保存
document.getElementById('save-btn').addEventListener('click', () => {
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
  a.download = `annotated-${ts}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
});

// 座標取得（マウス／タッチ両対応）
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let cx, cy;
  if (e.changedTouches?.length) {
    cx = e.changedTouches[0].clientX;
    cy = e.changedTouches[0].clientY;
  } else if (e.touches?.length) {
    cx = e.touches[0].clientX;
    cy = e.touches[0].clientY;
  } else {
    cx = e.clientX;
    cy = e.clientY;
  }
  return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
}

// 描画
canvas.addEventListener('mousedown', onStart);
canvas.addEventListener('touchstart', onStart, { passive: false });
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('mouseup', onEnd);
canvas.addEventListener('touchend', onEnd);

function onStart(e) {
  e.preventDefault();
  drawing = true;
  const p = getPos(e);
  startX = p.x;
  startY = p.y;
  snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

  if (currentTool === 'pen') {
    ctx.beginPath();
    ctx.moveTo(startX, startY);
  }
}

function onMove(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  const x = p.x, y = p.y;

  if (currentTool === 'pen') {
    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = parseInt(strokeSize.value);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineTo(x, y);
    ctx.stroke();
    return;
  }

  ctx.putImageData(snapshot, 0, 0);
  const w = x - startX, h = y - startY;
  const lw = parseInt(strokeSize.value);

  switch (currentTool) {
    case 'black':
      ctx.fillStyle = '#000';
      ctx.fillRect(startX, startY, w, h);
      break;
    case 'mosaic':
      // プレビュー: 赤枠
      ctx.strokeStyle = 'rgba(255,50,50,0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 3]);
      ctx.strokeRect(startX, startY, w, h);
      ctx.setLineDash([]);
      break;
    case 'marker':
      ctx.fillStyle = hexToRgba(colorPicker.value, 0.4);
      ctx.fillRect(startX, startY, w, h);
      break;
    case 'underline': {
      // 水平・垂直にスナップ（移動量が大きい方に揃える）
      const endX = Math.abs(w) >= Math.abs(h) ? x : startX;
      const endY = Math.abs(w) >= Math.abs(h) ? startY : y;
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = lw;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.lineTo(endX, endY);
      ctx.stroke();
      break;
    }
    case 'circle':
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.ellipse(
        startX + w / 2, startY + h / 2,
        Math.abs(w / 2), Math.abs(h / 2),
        0, 0, Math.PI * 2
      );
      ctx.stroke();
      break;
    case 'trim': {
      const trx = Math.min(startX, startX + w);
      const try_ = Math.min(startY, startY + h);
      const trw = Math.abs(w), trh = Math.abs(h);
      // 範囲外を暗くする
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, canvas.width, try_);
      ctx.fillRect(0, try_ + trh, canvas.width, canvas.height - try_ - trh);
      ctx.fillRect(0, try_, trx, trh);
      ctx.fillRect(trx + trw, try_, canvas.width - trx - trw, trh);
      // 白い外枠 → 水色内枠でどんな背景でも見える二重ライン
      ctx.lineWidth = 3;
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.strokeRect(trx - 1, try_ - 1, trw + 2, trh + 2);
      ctx.lineWidth = 1.5;
      ctx.setLineDash([8, 4]);
      ctx.strokeStyle = 'rgba(0,180,255,1)';
      ctx.strokeRect(trx, try_, trw, trh);
      ctx.setLineDash([]);
      // コーナーハンドル（8px四角）
      ctx.fillStyle = '#fff';
      const corners = [[trx,try_],[trx+trw,try_],[trx,try_+trh],[trx+trw,try_+trh]];
      corners.forEach(([cx,cy]) => ctx.fillRect(cx - 5, cy - 5, 10, 10));
      ctx.strokeStyle = 'rgba(0,180,255,1)';
      ctx.lineWidth = 1.5;
      corners.forEach(([cx,cy]) => ctx.strokeRect(cx - 5, cy - 5, 10, 10));
      break;
    }
  }
}

function onEnd(e) {
  if (!drawing) return;
  drawing = false;

  if (currentTool === 'mosaic') {
    const p = getPos(e);
    ctx.putImageData(snapshot, 0, 0);
    applyMosaic(startX, startY, p.x - startX, p.y - startY);
  }

  if (currentTool === 'trim') {
    const p = getPos(e);
    ctx.putImageData(snapshot, 0, 0);
    const rx = Math.round(Math.min(startX, p.x));
    const ry = Math.round(Math.min(startY, p.y));
    const rw = Math.round(Math.abs(p.x - startX));
    const rh = Math.round(Math.abs(p.y - startY));
    if (rw > 4 && rh > 4) {
      const cropped = ctx.getImageData(rx, ry, rw, rh);
      canvas.width = rw;
      canvas.height = rh;
      ctx.putImageData(cropped, 0, 0);
      undoStack = [];
      saveState();
      hint.textContent = hints[currentTool];
      return;
    }
  }

  saveState();
}

function applyMosaic(x, y, w, h) {
  const rx = Math.round(Math.min(x, x + w));
  const ry = Math.round(Math.min(y, y + h));
  const rw = Math.round(Math.abs(w));
  const rh = Math.round(Math.abs(h));
  if (rw < 1 || rh < 1) return;

  const block = Math.max(6, Math.floor(Math.min(rw, rh) / 12));
  const data = ctx.getImageData(rx, ry, rw, rh);
  const d = data.data;

  for (let bx = 0; bx < rw; bx += block) {
    for (let by = 0; by < rh; by += block) {
      const i = (by * rw + bx) * 4;
      const r = d[i], g = d[i+1], b = d[i+2];
      const maxBx = Math.min(bx + block, rw);
      const maxBy = Math.min(by + block, rh);
      for (let px = bx; px < maxBx; px++) {
        for (let py = by; py < maxBy; py++) {
          const j = (py * rw + px) * 4;
          d[j] = r; d[j+1] = g; d[j+2] = b;
        }
      }
    }
  }
  ctx.putImageData(data, rx, ry);
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

// キーボードショートカット
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'z') {
    e.preventDefault();
    document.getElementById('undo-btn').click();
  }
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    document.getElementById('save-btn').click();
  }
  // 上下キーで太さ変更（描画中でも有効）
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    strokeSize.value = Math.min(30, parseInt(strokeSize.value) + 1);
    hint.textContent = `太さ: ${strokeSize.value}`;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    strokeSize.value = Math.max(1, parseInt(strokeSize.value) - 1);
    hint.textContent = `太さ: ${strokeSize.value}`;
  }
  const keys = { '1':'black','2':'mosaic','3':'marker','4':'underline','5':'circle','6':'pen','7':'trim' };
  if (keys[e.key]) {
    const btn = document.querySelector(`[data-tool="${keys[e.key]}"]`);
    if (btn) btn.click();
  }
});
</script>
</body>
</html>
